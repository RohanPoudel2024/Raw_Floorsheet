name: Daily Floorsheet Scraper

on:
  # ── Schedule: Nepal Time (NPT) = UTC + 5:45 ──
  # Market closes 3:00 PM NPT → scrape at 3:15 PM NPT
  # 3:15 PM NPT  =  15:15 - 5:45  =  09:30 UTC
  schedule:
    - cron: "30 9 * * 1-5"  # Mon–Fri, 09:30 UTC = 3:15 PM NPT 

  # ── Allow manual trigger from GitHub UI ──
  workflow_dispatch:
    inputs:
      date:
        description: "Date to scrape (MM/DD/YYYY). Leave empty for today."
        required: false
        default: ""
      backfill:
        description: "Run backfill to fill missing dates?"
        type: boolean
        required: false
        default: false
      backfill_from:
        description: "Start backfill from date (MM/DD/YYYY). Only used when backfill=true."
        required: false
        default: ""

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write  # Required to push CSV data back to repo

    steps:
      # ── 1. Checkout repo (skip LFS download — no need to pull 1.3 GB of CSVs) ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      # ── 2. Set up Git LFS ──
      - name: Set up Git LFS
        run: git lfs install

      # ── 3. Pull ONLY the current month's CSV (not all 1.3 GB of history) ──
      # This preserves existing monthly data so today's scrape correctly appends
      - name: Pull current month CSV
        run: |
          MONTH=$(TZ="Asia/Kathmandu" date +"%Y_%m")
          echo "Pulling current month file: data/${MONTH}_floorsheet.csv"
          git lfs pull --include="data/${MONTH}_floorsheet.csv" || true

      # ── 3. Set up Python ──
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 4. Install dependencies ──
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Configure Git identity ──
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # ── 6. Run the scraper ──
      - name: Run Daily Scraper
        run: |
          CMD="python daily_scraper.py --no-push"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.date }}" ]; then
              CMD="$CMD --date \"${{ github.event.inputs.date }}\""
            fi
            if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
              CMD="$CMD --backfill"
              if [ -n "${{ github.event.inputs.backfill_from }}" ]; then
                CMD="$CMD --backfill-from \"${{ github.event.inputs.backfill_from }}\""
              fi
            fi
          fi

          echo "Running: $CMD"
          eval $CMD

      # ── 7. Commit and push updated CSVs via LFS ──
      - name: Commit and push data
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No new data scraped (holiday or already up to date)."
          else
            TODAY=$(TZ="Asia/Kathmandu" date +"%Y-%m-%d")
            git commit -m "Auto-scrape floorsheet: ${TODAY} [skip ci]"
            git push origin main
            echo " Pushed updated floorsheet data for ${TODAY}"
          fi

      # ── 8. Upload log as artifact for debugging ──
      - name: Upload Scraper Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-log-${{ github.run_id }}
          path: daily_scraper.log
          retention-days: 14
